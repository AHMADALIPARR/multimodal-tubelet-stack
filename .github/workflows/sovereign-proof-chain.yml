name: Sovereign Proof Chain

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Only steps that actually run:
#   1. ATS type-check (patscc -tcats) — hard first gate
#   2. C zero-copy layer compile
#   3. C# host build
# No continue-on-error. No optional toolchains. No presence checks.

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: "Install ATS and type-check geometry"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ats2-lang
          patscc -tcats ats/tubelet_geometry.dats

      - name: "Compile zero-copy C layer"
        run: |
          mkdir -p bin
          gcc -shared -fPIC -o bin/nvme_mmap.so c/nvme_mmap.c -O3

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: "Build C# host"
        run: |
          cd csharp
          dotnet restore MultimodalHost.csproj
          dotnet build MultimodalHost.csproj -c Release --no-restore
